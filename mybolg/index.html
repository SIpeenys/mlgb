<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六便士的世界</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    /* ====== 头部 ====== */
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 60px 20px 40px;
      text-align: center;
      border-radius: 0 0 30px 30px;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2.2em;
      margin-bottom: 5px;
    }
    header p {
      font-size: 1.1em;
      opacity: 0.85;
    }
    /* ====== 个人资料卡片 ====== */
    .profile-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }
    .profile-card .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #667eea;
      flex-shrink: 0;
    }
    .profile-card .info {
      flex: 1;
      min-width: 200px;
    }
    .profile-card .info h2 {
      font-size: 1.8em;
      margin-bottom: 5px;
    }
    .profile-card .info .bio {
      color: #666;
      margin-bottom: 10px;
    }
    .profile-card .info .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .profile-card .info .tags span {
      background: #f0f0f0;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      color: #555;
    }
    /* ====== 社交媒体 ====== */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .social-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .social-links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    /* ====== 文章列表 ====== */
    .section-title {
      font-size: 1.4em;
      margin-bottom: 20px;
      padding-left: 10px;
      border-left: 4px solid #667eea;
    }
    .article-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .article-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .article-card h3 {
      font-size: 1.2em;
      margin-bottom: 8px;
      color: #222;
    }
    .article-card .meta {
      font-size: 0.85em;
      color: #999;
      margin-bottom: 10px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .article-card .meta .tag {
      background: #e8e8ff;
      color: #667eea;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.85em;
    }
    .article-card p {
      color: #666;
      font-size: 0.95em;
    }
    /* ====== 文章详情弹窗 ====== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
      padding: 40px 20px;
    }
    .modal-overlay.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      position: relative;
      margin-top: 40px;
      margin-bottom: 40px;
    }
    .modal-content .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
      color: #999;
      background: none;
      border: none;
    }
    .modal-content .close-btn:hover {
      color: #333;
    }
    .modal-content h2 {
      font-size: 1.6em;
      margin-bottom: 10px;
      padding-right: 30px;
    }
    .modal-content .article-date {
      color: #999;
      font-size: 0.9em;
      margin-bottom: 20px;
    }
    .modal-content .article-body {
      line-height: 1.8;
    }
    .modal-content .article-body h2 { font-size: 1.4em; margin: 20px 0 10px; }
    .modal-content .article-body h3 { font-size: 1.2em; margin: 16px 0 8px; }
    .modal-content .article-body p { margin-bottom: 12px; }
    .modal-content .article-body ul, 
    .modal-content .article-body ol { margin: 8px 0 12px 20px; }
    .modal-content .article-body blockquote {
      border-left: 4px solid #667eea;
      padding: 10px 20px;
      margin: 16px 0;
      background: #f8f8ff;
      border-radius: 0 8px 8px 0;
      color: #555;
    }
    .modal-content .article-body a { color: #667eea; }
    /* ====== Giscus 评论区 ====== */
    .giscus-container {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #eee;
    }
    .giscus-container h3 {
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    /* ====== Footer ====== */
    footer {
      text-align: center;
      padding: 30px 20px;
      color: #999;
      font-size: 0.9em;
    }
    /* ====== 响应式 ====== */
    @media (max-width: 600px) {
      header { padding: 40px 20px 30px; }
      header h1 { font-size: 1.6em; }
      .profile-card { padding: 20px; }
      .profile-card .avatar { width: 80px; height: 80px; }
      .modal-content { padding: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="site-name">六便士的世界</h1>
    <p id="site-subtitle">记录生活 · 分享思考</p>
  </header>

  <div class="container">
    <!-- 个人资料 -->
    <div class="profile-card">
      <img class="avatar" id="profile-avatar" src="assets/avatar.jpg" alt="头像" onerror="this.style.display='none'">
      <div class="info">
        <h2 id="profile-name">六块钱</h2>
        <p class="bio" id="profile-bio">一个热爱生活、热爱技术的人。</p>
        <div class="tags" id="profile-tags"></div>
      </div>
    </div>

    <!-- 社交媒体 -->
    <div class="social-links" id="social-links"></div>

    <!-- 文章列表 -->
    <h2 class="section-title">📖 文章</h2>
    <div class="article-list" id="article-list"></div>
  </div>

  <!-- 文章弹窗 -->
  <div class="modal-overlay" id="article-modal">
    <div class="modal-content">
      <button class="close-btn" id="modal-close">&times;</button>
      <h2 id="modal-title"></h2>
      <p class="article-date" id="modal-date"></p>
      <div class="article-body" id="modal-body"></div>
      <!-- Giscus 评论区 -->
      <div class="giscus-container">
        <h3>💬 留言</h3>
        <div id="giscus-comments"></div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 六便士的世界. All rights reserved.</p>
  </footer>

  <script src="data.js"></script>
  <script>
    // ====== 渲染网站 ======
    const data = SITE_DATA;

    // 基本信息
    document.getElementById('site-name').textContent = data.siteName;
    document.getElementById('site-subtitle').textContent = data.siteSubtitle;

    // 个人资料
    document.getElementById('profile-name').textContent = data.profile.name;
    document.getElementById('profile-bio').textContent = data.profile.bio;
    const avatar = document.getElementById('profile-avatar');
    avatar.src = data.profile.avatar;
    avatar.alt = data.profile.name;

    const tagsContainer = document.getElementById('profile-tags');
    if (data.profile.tags) {
      data.profile.tags.forEach(tag => {
        const span = document.createElement('span');
        span.textContent = tag;
        tagsContainer.appendChild(span);
      });
    }

    // 社交媒体
    const socialContainer = document.getElementById('social-links');
    if (data.social) {
      data.social.forEach(item => {
        const a = document.createElement('a');
        a.href = item.url;
        a.target = '_blank';
        a.innerHTML = `${item.icon} ${item.name}`;
        socialContainer.appendChild(a);
      });
    }

    // 文章列表
    const articleList = document.getElementById('article-list');
    function renderArticles() {
      articleList.innerHTML = '';
      data.articles.forEach(article => {
        const card = document.createElement('div');
        card.className = 'article-card';
        card.onclick = () => openArticle(article.id);

        let tagsHtml = '';
        if (article.tags) {
          tagsHtml = article.tags.map(t => `<span class="tag">${t}</span>`).join('');
        }

        card.innerHTML = `
          <h3>${article.title}</h3>
          <div class="meta">
            <span>📅 ${article.date}</span>
            ${tagsHtml}
          </div>
          <p>${article.summary}</p>
        `;
        articleList.appendChild(card);
      });
    }
    renderArticles();

    // 文章弹窗
    const modal = document.getElementById('article-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDate = document.getElementById('modal-date');
    const modalBody = document.getElementById('modal-body');
    const modalClose = document.getElementById('modal-close');
    const giscusContainer = document.getElementById('giscus-comments');

    function openArticle(id) {
      const article = data.articles.find(a => a.id === id);
      if (!article) return;

      modalTitle.textContent = article.title;
      modalDate.textContent = '📅 ' + article.date;
      modalBody.innerHTML = article.content || '';

      // 重新加载 Giscus（按文章标题区分评论）
      giscusContainer.innerHTML = '';
      const script = document.createElement('script');
      script.src = 'https://giscus.app/client.js';
      script.setAttribute('data-repo', data.giscus.repo);
      script.setAttribute('data-repo-id', 'R_kgDON85EPg');
      script.setAttribute('data-category', data.giscus.category);
      script.setAttribute('data-category-id', 'DIC_kwDON85EPs4CmwRu');
      script.setAttribute('data-mapping', 'specific');
      script.setAttribute('data-term', article.title);
      script.setAttribute('data-strict', '0');
      script.setAttribute('data-reactions-enabled', '1');
      script.setAttribute('data-emit-metadata', '0');
      script.setAttribute('data-input-position', 'bottom');
      script.setAttribute('data-theme', 'preferred_color_scheme');
      script.setAttribute('data-lang', 'zh-CN');
      script.setAttribute('data-loading', 'lazy');
      script.crossOrigin = 'anonymous';
      script.async = true;
      giscusContainer.appendChild(script);

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    modalClose.onclick = closeModal;
    modal.onclick = (e) => {
      if (e.target === modal) closeModal();
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
